name: Monitor curso moto

on:
  # Horario en UTC (Campeche = UTC-6). Publican normalmente mar-jue en la tarde.
  schedule:
    # Ventana probable: martes a jueves 8:00-22:00 Campeche, cada 5 min
    - cron: "*/5 14-23 * * 2-4"
    - cron: "*/5 0-3 * * 3-5"
    # Resto del tiempo: cada 30 min (por si publican otro dia o se libera un lugar)
    - cron: "15,45 * * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar notificacion de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: monitor

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Revisar cupo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py ${{ inputs.prueba && '--prueba' || '' }}
      - name: Guardar avisados
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add notificados.json
          git diff --cached --quiet || (git commit -m "Actualiza avisados" && git push)
